org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
org.gradle.caching=false
android.useAndroidX=true

# Kotlin incremental compile breaks on Windows when the app lives on one drive (e.g. D:)
# and Pub cache is on another (e.g. C:): "this and base files have different roots".
# Disabling incremental avoids RelocatableFileToPathConverter errors for plugins like share_plus.
kotlin.incremental=false

# Dependency downloads after Gradle starts (wrapper uses gradle-wrapper.properties networkTimeout).
systemProp.http.socketTimeout=600000
systemProp.http.connectionTimeout=600000
